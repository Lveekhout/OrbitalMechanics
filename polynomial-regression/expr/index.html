<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Polynomial Regression</title>
    <link rel="stylesheet" href="css/index.css">
    <script src="../../lib/Animation2d.js"></script>
    <script src="../../expressions-parser/js/parser-utils.js"></script>
    <script src="../../expressions-parser/js/parser.js"></script>
    <script src="../../expressions/js/expression-code/evaluate.js"></script>
    <script src="../../expressions/js/expression-code/example-code.js"></script>
    <script src="js/matrix_numeric.js"></script>
    <script src="js/matrix_expression.js"></script>
    <script src="js/canvas.js"></script>
    <script src="js/html-select.js"></script>
    <script src="js/determinant.js"></script>
    <script src="js/desmos.js"></script>
    <script src="js/index.js"></script>
</head>
<body>
<table border="1" cellpadding="0" cellspacing="0">
    <tr>
        <td colspan="2">
            <canvas id="canvas" width="920" height="640"></canvas>
        </td>
    </tr>
    <tr>
        <td>
            <label>Number of points</label>
            <select id="points" oninput="select1Click(event)">
            </select>
        </td>
        <td>
            <label>Polynomial degree</label>
            <select id="degree" oninput="select2Click(event)">
                <option selected>0</option>
                <option>1</option>
                <option>2</option>
                <option>3</option>
                <option>4</option>
                <option>5</option>
                <option>6</option>
                <option>7</option>
            </select>
        </td>
    </tr>
</table>
</body>
</html>
